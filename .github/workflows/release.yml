name: release

# Tag a version to build the binaries and publish a GitHub Release whose asset
# names match what the website's download page looks for.
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, bin: adm.exe, asset: adm-windows-x64.zip,    kind: zip }
          - { goos: windows, goarch: arm64, bin: adm.exe, asset: adm-windows-arm64.zip,  kind: zip }
          - { goos: darwin,  goarch: amd64, bin: adm,     asset: adm-macos-amd64.zip,    kind: zip }
          - { goos: darwin,  goarch: arm64, bin: adm,     asset: adm-macos-arm64.zip,    kind: zip }
          - { goos: linux,   goarch: amd64, bin: adm,     asset: adm-linux-amd64.tar.gz, kind: tar }
          - { goos: linux,   goarch: arm64, bin: adm,     asset: adm-linux-arm64.tar.gz, kind: tar }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "${{ matrix.bin }}" .
      - name: Package
        run: |
          if [ "${{ matrix.kind }}" = "zip" ]; then
            zip -q "${{ matrix.asset }}" "${{ matrix.bin }}" README.md LICENSE
          else
            tar czf "${{ matrix.asset }}" "${{ matrix.bin }}" README.md LICENSE
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
